<style>
  html,body{margin:0;padding:0;background:#FBF7EF;}
  text{font-family:'Liberation Serif',Georgia,serif;} svg{display:block;}
</style>
<svg width="1600" height="900" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="perf" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="9" cy="9" r="3" fill="#FBF7EF"/>
    </pattern>
  </defs>
  <rect width="1600" height="900" fill="#FBF7EF"/>
  <text x="80" y="72" font-size="40" font-weight="bold" fill="#16314F">Two Tickets</text>
  <text x="80" y="110" font-size="22" fill="#6B4423" font-style="italic">The whole difference between escaping and coping is printed on the stub</text>
  <line x1="80" y1="132" x2="1520" y2="132" stroke="#16314F" stroke-width="2.5"/>

  <!-- LEFT TICKET : one way -->
  <g>
    <rect x="90" y="190" width="660" height="380" rx="10" fill="#6B4423"/>
    <rect x="90" y="190" width="660" height="380" rx="10" fill="none" stroke="#3F2713" stroke-width="4"/>
    <line x1="615" y1="206" x2="615" y2="554" stroke="#F0DCC0" stroke-width="4" stroke-dasharray="11 13" opacity="0.75"/>
    <text x="128" y="248" font-size="17" fill="#E4CDAE" letter-spacing="4">THE THIRD LEVEL &#183; GRAND CENTRAL</text>
    <line x1="128" y1="266" x2="575" y2="266" stroke="#C9A97E" stroke-width="1.5"/>
    <text x="128" y="326" font-size="32" font-weight="bold" fill="#FBF7EF">NEW YORK &#8594; GALESBURG</text>
    <text x="128" y="372" font-size="27" fill="#EDD9BC">Illinois &#183; the year 1894</text>
    <rect x="128" y="404" width="250" height="56" fill="#FBF7EF"/>
    <text x="253" y="443" font-size="30" font-weight="bold" fill="#6B4423" text-anchor="middle">ONE WAY</text>
    <text x="128" y="500" font-size="20" fill="#EDD9BC">Two coach tickets. Paid for in old-style</text>
    <text x="128" y="528" font-size="20" fill="#EDD9BC">bills. No date of return is printed.</text>
    <text x="684" y="320" font-size="19" fill="#E4CDAE" letter-spacing="5" transform="rotate(90 684 320)" text-anchor="middle">ESCAPISM</text>
  </g>

  <!-- RIGHT TICKET : return -->
  <g>
    <rect x="850" y="190" width="660" height="380" rx="10" fill="#16314F"/>
    <rect x="850" y="190" width="660" height="380" rx="10" fill="none" stroke="#0B1B2D" stroke-width="4"/>
    <line x1="1375" y1="206" x2="1375" y2="554" stroke="#C6DAEA" stroke-width="4" stroke-dasharray="11 13" opacity="0.75"/>
    <text x="888" y="248" font-size="17" fill="#B7D2E5" letter-spacing="4">ANY MIDNIGHT &#183; ANY CITY</text>
    <line x1="888" y1="266" x2="1335" y2="266" stroke="#7FA8C7" stroke-width="1.5"/>
    <text x="888" y="326" font-size="32" font-weight="bold" fill="#FBF7EF">THE PRESENT &#8594; ELSEWHERE</text>
    <text x="888" y="372" font-size="27" fill="#CFE1EE">A book, a film, an hour of music</text>
    <rect x="888" y="404" width="250" height="56" fill="#FBF7EF"/>
    <text x="1013" y="443" font-size="30" font-weight="bold" fill="#16314F" text-anchor="middle">RETURN</text>
    <text x="888" y="500" font-size="20" fill="#CFE1EE">Valid only if you come back. The rest of</text>
    <text x="888" y="528" font-size="20" fill="#CFE1EE">the journey is the point of the journey.</text>
    <text x="1444" y="320" font-size="19" fill="#B7D2E5" letter-spacing="5" transform="rotate(90 1444 320)" text-anchor="middle">COPING</text>
  </g>

  <!-- footer -->
  <line x1="80" y1="640" x2="1520" y2="640" stroke="#16314F" stroke-width="1.5"/>
  <text x="80" y="694" font-size="24" fill="#101820">Charley asks the clerk for &#8220;two coach tickets, <tspan font-style="italic">one way</tspan>&#8221;. He is refused, and spends the rest of</text>
  <text x="80" y="730" font-size="24" fill="#101820">the story trying to buy them again. Gil climbs into the Peugeot every midnight &#8212; and climbs out</text>
  <text x="80" y="766" font-size="24" fill="#101820">again every morning, until the morning he decides he no longer needs to climb in at all.</text>
  <text x="80" y="836" font-size="26" fill="#6B4423" font-style="italic">An escape you return from is rest. An escape you do not return from is a disappearance.</text>
</svg>
