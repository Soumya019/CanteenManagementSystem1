<style>
  html,body{margin:0;padding:0;background:#FBF7EF;}
  text{font-family:'Liberation Serif',Georgia,serif;} svg{display:block;}
</style>
<svg width="1600" height="1000" viewBox="0 0 1600 1000" xmlns="http://www.w3.org/2000/svg">
  <rect width="1600" height="1000" fill="#FBF7EF"/>
  <text x="80" y="72" font-size="40" font-weight="bold" fill="#16314F">Why 2026 Wants a Third Level</text>
  <text x="80" y="110" font-size="22" fill="#6B4423" font-style="italic">Finney&#8217;s diagnosis &#8212; &#8220;insecurity, fear, war, worry&#8221; &#8212; reissued for a generation he never met</text>
  <line x1="80" y1="132" x2="1520" y2="132" stroke="#16314F" stroke-width="2.5"/>

  <!-- three pressure panels -->
  <g>
    <rect x="80" y="180" width="440" height="300" fill="#16314F"/>
    <text x="112" y="238" font-size="46" fill="#8FBEDD" font-weight="bold">01</text>
    <text x="112" y="290" font-size="27" font-weight="bold" fill="#FBF7EF">EXAM PRESSURE</text>
    <line x1="112" y1="308" x2="300" y2="308" stroke="#8FBEDD" stroke-width="2"/>
    <text x="112" y="348" font-size="19" fill="#DCE9F2">A single fortnight of papers</text>
    <text x="112" y="376" font-size="19" fill="#DCE9F2">treated as a verdict on an</text>
    <text x="112" y="404" font-size="19" fill="#DCE9F2">entire person. Charley had</text>
    <text x="112" y="432" font-size="19" fill="#DCE9F2">a job; we have a cut-off.</text>
  </g>
  <g>
    <rect x="580" y="180" width="440" height="300" fill="#4B3B68"/>
    <text x="612" y="238" font-size="46" fill="#BFB2D8" font-weight="bold">02</text>
    <text x="612" y="290" font-size="27" font-weight="bold" fill="#FBF7EF">THE INFINITE SCROLL</text>
    <line x1="612" y1="308" x2="800" y2="308" stroke="#BFB2D8" stroke-width="2"/>
    <text x="612" y="348" font-size="19" fill="#E6DFF0">A feed engineered so that no</text>
    <text x="612" y="376" font-size="19" fill="#E6DFF0">evening is ever quite enough</text>
    <text x="612" y="404" font-size="19" fill="#E6DFF0">&#8212; everyone else&#8217;s edited best</text>
    <text x="612" y="432" font-size="19" fill="#E6DFF0">hours, available all night.</text>
  </g>
  <g>
    <rect x="1080" y="180" width="440" height="300" fill="#6B4423"/>
    <text x="1112" y="238" font-size="46" fill="#DCC3A4" font-weight="bold">03</text>
    <text x="1112" y="290" font-size="27" font-weight="bold" fill="#FBF7EF">AI ANXIETY</text>
    <line x1="1112" y1="308" x2="1300" y2="308" stroke="#DCC3A4" stroke-width="2"/>
    <text x="1112" y="348" font-size="19" fill="#F0E4D4">The quiet question of whether</text>
    <text x="1112" y="376" font-size="19" fill="#F0E4D4">the profession you are being</text>
    <text x="1112" y="404" font-size="19" fill="#F0E4D4">examined for will still exist</text>
    <text x="1112" y="432" font-size="19" fill="#F0E4D4">by the time you reach it.</text>
  </g>

  <!-- converging arrows -->
  <g stroke="#101820" stroke-width="3" fill="none" opacity="0.65">
    <path d="M300 500 L740 590"/>
    <path d="M800 500 L800 590"/>
    <path d="M1300 500 L860 590"/>
  </g>
  <polygon points="740,590 706,570 716,600" fill="#101820" opacity="0.65"/>
  <polygon points="800,600 786,566 814,566" fill="#101820" opacity="0.65"/>
  <polygon points="860,590 894,570 884,600" fill="#101820" opacity="0.65"/>

  <!-- the student -->
  <g transform="translate(800,690)">
    <circle cx="0" cy="-34" r="26" fill="#16314F"/>
    <path d="M-34 -4 q34 -22 68 0 v56 h-68 z" fill="#16314F"/>
    <rect x="-52" y="52" width="104" height="9" rx="3" fill="#6B4423"/>
    <rect x="-14" y="18" width="28" height="20" rx="3" fill="#8FBEDD"/>
  </g>
  <text x="800" y="800" font-size="21" fill="#101820" text-anchor="middle" font-style="italic">&#8220;I&#8217;m just an ordinary guy named Charley, thirty-one years old&#8221; &#8212; and seventeen, and in Class XII.</text>

  <!-- footer -->
  <line x1="80" y1="850" x2="1520" y2="850" stroke="#16314F" stroke-width="1.5"/>
  <text x="80" y="900" font-size="23" fill="#16314F">Finney wrote for a generation that had survived two world wars. The nouns have changed;</text>
  <text x="80" y="934" font-size="23" fill="#16314F">the sentence has not. Every era manufactures its own reason to go looking for a staircase</text>
  <text x="80" y="968" font-size="23" fill="#16314F">that the timetable says is not there.</text>
</svg>
