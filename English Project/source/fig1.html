<style>
  html,body{margin:0;padding:0;background:#FBF7EF;}
  .wrap{width:1600px;height:900px;position:relative;font-family:'Liberation Serif',Georgia,serif;}
  text{font-family:'Liberation Serif',Georgia,serif;} svg{display:block;}
</style>
<div class="wrap">
<svg width="1600" height="900" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="l1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D6E7F2"/><stop offset="100%" stop-color="#B9D5E8"/>
    </linearGradient>
    <linearGradient id="l2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#A8C6DD"/><stop offset="100%" stop-color="#7FA8C7"/>
    </linearGradient>
    <linearGradient id="l3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#B08A5E"/><stop offset="100%" stop-color="#6B4423"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E8C99A" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#E8C99A" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="#FBF7EF"/>

  <!-- Title -->
  <text x="80" y="78" font-size="42" font-weight="bold" fill="#16314F">The Architecture of Escape</text>
  <text x="80" y="116" font-size="23" fill="#6B4423" font-style="italic">A cross-section of Grand Central Station as Charley descends &#8212; and of the mind that descends with him</text>
  <line x1="80" y1="140" x2="1520" y2="140" stroke="#16314F" stroke-width="2.5"/>

  <!-- Street level marker -->
  <text x="80" y="188" font-size="17" fill="#234E77" letter-spacing="3">STREET &#183; VANDERBILT AVENUE</text>
  <line x1="80" y1="200" x2="880" y2="200" stroke="#101820" stroke-width="3"/>

  <!-- LEVEL 1 -->
  <rect x="80" y="200" width="800" height="170" fill="url(#l1)" stroke="#234E77" stroke-width="2"/>
  <text x="112" y="248" font-size="27" font-weight="bold" fill="#16314F">FIRST LEVEL</text>
  <text x="112" y="282" font-size="20" fill="#234E77">Long-distance trains &#8212; &#8220;the Twentieth Century&#8221;</text>
  <!-- commuter silhouettes -->
  <g fill="#16314F" opacity="0.75">
    <g transform="translate(600,294) scale(0.9)">
      <circle cx="0" cy="-42" r="11"/><rect x="-9" y="-29" width="18" height="30" rx="4"/><rect x="-8" y="0" width="6" height="26"/><rect x="2" y="0" width="6" height="26"/>
    </g>
    <g transform="translate(650,294) scale(0.9)">
      <circle cx="0" cy="-42" r="11"/><rect x="-9" y="-29" width="18" height="30" rx="4"/><rect x="-8" y="0" width="6" height="26"/><rect x="2" y="0" width="6" height="26"/>
    </g>
    <g transform="translate(700,294) scale(0.9)">
      <circle cx="0" cy="-42" r="11"/><rect x="-9" y="-29" width="18" height="30" rx="4"/><rect x="-8" y="0" width="6" height="26"/><rect x="2" y="0" width="6" height="26"/>
    </g>
    <g transform="translate(750,294) scale(0.9)">
      <circle cx="0" cy="-42" r="11"/><rect x="-9" y="-29" width="18" height="30" rx="4"/><rect x="-8" y="0" width="6" height="26"/><rect x="2" y="0" width="6" height="26"/>
    </g>
  </g>
  <text x="520" y="350" font-size="15" fill="#234E77" font-style="italic">&#8220;I passed a dozen men who looked just like me.&#8221;</text>

  <!-- LEVEL 2 -->
  <rect x="80" y="380" width="800" height="170" fill="url(#l2)" stroke="#234E77" stroke-width="2"/>
  <text x="112" y="428" font-size="27" font-weight="bold" fill="#16314F">SECOND LEVEL</text>
  <text x="112" y="462" font-size="20" fill="#16314F">Suburban trains &#8212; the route home to Louisa</text>
  <g stroke="#16314F" stroke-width="3" opacity="0.6" fill="none">
    <path d="M600 505 h230"/><path d="M600 520 h230"/>
    <path d="M612 498 v29 M642 498 v29 M672 498 v29 M702 498 v29 M732 498 v29 M762 498 v29 M792 498 v29 M822 498 v29"/>
  </g>

  <!-- corridor -->
  <path d="M300 550 C 330 600, 380 630, 300 678" fill="none" stroke="#6B4423" stroke-width="4" stroke-dasharray="12 9"/>
  <text x="345" y="618" font-size="17" fill="#6B4423" font-style="italic">the corridor &#8212; &#8220;angling</text>
  <text x="345" y="640" font-size="17" fill="#6B4423" font-style="italic">left and slanting downward&#8221;</text>

  <!-- LEVEL 3 -->
  <ellipse cx="480" cy="758" rx="430" ry="120" fill="url(#glow)"/>
  <rect x="80" y="680" width="800" height="152" fill="url(#l3)" stroke="#6B4423" stroke-width="2"/>
  <text x="112" y="726" font-size="27" font-weight="bold" fill="#FBF7EF">THIRD LEVEL</text>
  <text x="112" y="760" font-size="20" fill="#F0E2CE">Gaslight, brass spittoons, &#8220;The World&#8221; &#8212; 11 June 1894</text>
  <!-- gaslamps -->
  <g>
    <g transform="translate(620,822)">
      <rect x="-3" y="-58" width="6" height="58" fill="#3A2412"/>
      <circle cx="0" cy="-68" r="12" fill="#E8C99A"/><circle cx="0" cy="-68" r="22" fill="#E8C99A" opacity="0.25"/>
    </g>
    <g transform="translate(720,822)">
      <rect x="-3" y="-58" width="6" height="58" fill="#3A2412"/>
      <circle cx="0" cy="-68" r="12" fill="#E8C99A"/><circle cx="0" cy="-68" r="22" fill="#E8C99A" opacity="0.25"/>
    </g>
    <g transform="translate(820,822)">
      <rect x="-3" y="-58" width="6" height="58" fill="#3A2412"/>
      <circle cx="0" cy="-68" r="12" fill="#E8C99A"/><circle cx="0" cy="-68" r="22" fill="#E8C99A" opacity="0.25"/>
    </g>
  </g>
  <text x="112" y="872" font-size="16" fill="#6B4423" font-style="italic">Officially, this level does not exist.</text>

  <!-- RIGHT COLUMN : psychological reading -->
  <line x1="945" y1="200" x2="945" y2="860" stroke="#6B4423" stroke-width="1.5" stroke-dasharray="5 6"/>
  <text x="985" y="188" font-size="17" fill="#4B3B68" letter-spacing="3">THE PSYCHOLOGICAL READING</text>

  <g>
    <rect x="985" y="212" width="14" height="146" fill="#234E77"/>
    <text x="1020" y="248" font-size="25" font-weight="bold" fill="#16314F">The Public Self</text>
    <text x="1020" y="284" font-size="19" fill="#101820">Work, ambition, the late night at</text>
    <text x="1020" y="310" font-size="19" fill="#101820">the office. A self that is efficient</text>
    <text x="1020" y="336" font-size="19" fill="#101820">but interchangeable.</text>
  </g>
  <g>
    <rect x="985" y="392" width="14" height="146" fill="#4B3B68"/>
    <text x="1020" y="428" font-size="25" font-weight="bold" fill="#4B3B68">The Domestic Self</text>
    <text x="1020" y="464" font-size="19" fill="#101820">Marriage, routine, Louisa&#8217;s</text>
    <text x="1020" y="490" font-size="19" fill="#101820">rational worry. Safe, ordinary,</text>
    <text x="1020" y="516" font-size="19" fill="#101820">and quietly insufficient.</text>
  </g>
  <g>
    <rect x="985" y="600" width="14" height="200" fill="#6B4423"/>
    <text x="1020" y="636" font-size="25" font-weight="bold" fill="#6B4423">The Buried Self</text>
    <text x="1020" y="672" font-size="19" fill="#101820">Wish-fulfilment. The grandfather&#8217;s</text>
    <text x="1020" y="698" font-size="19" fill="#101820">world, inherited rather than lived.</text>
    <text x="1020" y="724" font-size="19" fill="#101820">Sam calls it &#8220;a waking-dream wish</text>
    <text x="1020" y="750" font-size="19" fill="#101820">fulfillment&#8221;; Charley calls it a</text>
    <text x="1020" y="776" font-size="19" fill="#101820">railway station.</text>
  </g>
  <path d="M1465 232 L1465 780" stroke="#6B4423" stroke-width="3" marker-end="url(#ar)"/>
  <defs><marker id="ar" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
    <path d="M0 0 L10 5 L0 10 z" fill="#6B4423"/></marker></defs>
  <text x="1500" y="500" font-size="18" fill="#6B4423" letter-spacing="4" transform="rotate(90 1500 500)" text-anchor="middle">DEEPER FROM THE PRESENT</text>
</svg>
</div>
