<style>
  html,body{margin:0;padding:0;background:#FBF7EF;}
  text{font-family:'Liberation Serif',Georgia,serif;} svg{display:block;}
</style>
<svg width="1600" height="1100" viewBox="0 0 1600 1100" xmlns="http://www.w3.org/2000/svg">
  <rect width="1600" height="1100" fill="#FBF7EF"/>
  <text x="80" y="72" font-size="40" font-weight="bold" fill="#16314F">Two Men, Two Midnights</text>
  <text x="80" y="110" font-size="22" fill="#6B4423" font-style="italic">Charley of Grand Central and Gil Pender of the Rue Montagne Sainte-Genevi&#232;ve, side by side</text>
  <line x1="80" y1="132" x2="1520" y2="132" stroke="#16314F" stroke-width="2.5"/>

  <!-- Column headers -->
  <rect x="80" y="158" width="560" height="76" fill="#6B4423"/>
  <text x="360" y="196" font-size="28" font-weight="bold" fill="#FBF7EF" text-anchor="middle">CHARLEY</text>
  <text x="360" y="222" font-size="17" fill="#EBD9C2" text-anchor="middle">The Third Level &#183; Jack Finney &#183; 1950</text>

  <rect x="960" y="158" width="560" height="76" fill="#16314F"/>
  <text x="1240" y="196" font-size="28" font-weight="bold" fill="#FBF7EF" text-anchor="middle">GIL PENDER</text>
  <text x="1240" y="222" font-size="17" fill="#CDDDEA" text-anchor="middle">Midnight in Paris &#183; Woody Allen &#183; 2011</text>

  <g font-size="19" fill="#101820">
    <!-- row 1 -->
    <rect x="80" y="252" width="560" height="92" fill="#F1E6D6"/>
    <rect x="960" y="252" width="560" height="92" fill="#E4EDF5"/>
    <text x="800" y="298" font-size="16" fill="#4B3B68" letter-spacing="2" text-anchor="middle">THE DOORWAY</text>
    <line x1="700" y1="312" x2="900" y2="312" stroke="#7E6BA0" stroke-width="1"/>
    <text x="360" y="292" text-anchor="middle">A wrong corridor, &#8220;slanting</text>
    <text x="360" y="320" text-anchor="middle">downward&#8221;, taken by accident</text>
    <text x="1240" y="292" text-anchor="middle">A vintage Peugeot that stops</text>
    <text x="1240" y="320" text-anchor="middle">for him on the stroke of twelve</text>

    <!-- row 2 -->
    <rect x="80" y="356" width="560" height="92" fill="#EADCC7"/>
    <rect x="960" y="356" width="560" height="92" fill="#D8E5F0"/>
    <text x="800" y="402" font-size="16" fill="#4B3B68" letter-spacing="2" text-anchor="middle">THE DESTINATION</text>
    <line x1="700" y1="416" x2="900" y2="416" stroke="#7E6BA0" stroke-width="1"/>
    <text x="360" y="396" text-anchor="middle">Galesburg, Illinois, 1894 &#8212;</text>
    <text x="360" y="424" text-anchor="middle">his grandfather&#8217;s home town</text>
    <text x="1240" y="396" text-anchor="middle">Paris, the 1920s &#8212; the city of</text>
    <text x="1240" y="424" text-anchor="middle">the writers he has only read</text>

    <!-- row 3 -->
    <rect x="80" y="460" width="560" height="92" fill="#F1E6D6"/>
    <rect x="960" y="460" width="560" height="92" fill="#E4EDF5"/>
    <text x="800" y="506" font-size="16" fill="#4B3B68" letter-spacing="2" text-anchor="middle">THE BELIEVER</text>
    <line x1="700" y1="520" x2="900" y2="520" stroke="#7E6BA0" stroke-width="1"/>
    <text x="360" y="500" text-anchor="middle">Sam Weiner, the psychiatrist,</text>
    <text x="360" y="528" text-anchor="middle">who emigrates and stays</text>
    <text x="1240" y="500" text-anchor="middle">Adriana, who begs to stay in</text>
    <text x="1240" y="528" text-anchor="middle">an era older still</text>

    <!-- row 4 -->
    <rect x="80" y="564" width="560" height="92" fill="#EADCC7"/>
    <rect x="960" y="564" width="560" height="92" fill="#D8E5F0"/>
    <text x="800" y="610" font-size="16" fill="#4B3B68" letter-spacing="2" text-anchor="middle">THE SCEPTIC AT HOME</text>
    <line x1="700" y1="624" x2="900" y2="624" stroke="#7E6BA0" stroke-width="1"/>
    <text x="360" y="604" text-anchor="middle">Louisa, who &#8220;didn&#8217;t want me to</text>
    <text x="360" y="632" text-anchor="middle">look for the third level any more&#8221;</text>
    <text x="1240" y="604" text-anchor="middle">Inez, who prefers Malibu, and</text>
    <text x="1240" y="632" text-anchor="middle">Paul, who names the diagnosis</text>

    <!-- row 5 -->
    <rect x="80" y="668" width="560" height="92" fill="#F1E6D6"/>
    <rect x="960" y="668" width="560" height="92" fill="#E4EDF5"/>
    <text x="800" y="704" font-size="16" fill="#4B3B68" letter-spacing="2" text-anchor="middle">NATURE OF THE ESCAPE</text>
    <line x1="700" y1="718" x2="900" y2="718" stroke="#7E6BA0" stroke-width="1"/>
    <text x="360" y="704" text-anchor="middle">Supernatural in form,</text>
    <text x="360" y="732" text-anchor="middle">psychological in cause</text>
    <text x="1240" y="704" text-anchor="middle">Supernatural in form,</text>
    <text x="1240" y="732" text-anchor="middle">psychological in cause</text>
  </g>

  <!-- OUTCOME BAND -->
  <line x1="80" y1="800" x2="1520" y2="800" stroke="#16314F" stroke-width="1.5"/>
  <text x="80" y="840" font-size="17" fill="#4B3B68" letter-spacing="3">AND SO THE JOURNEY ENDS&#8230;</text>

  <!-- Charley one-way -->
  <g>
    <text x="96" y="890" font-size="22" font-weight="bold" fill="#6B4423">ONE WAY</text>
    <circle cx="112" cy="930" r="9" fill="#6B4423"/>
    <line x1="112" y1="930" x2="560" y2="930" stroke="#6B4423" stroke-width="5"/>
    <polygon points="560,916 596,930 560,944" fill="#6B4423"/>
    <text x="96" y="972" font-size="17" fill="#101820">1950</text>
    <text x="536" y="972" font-size="17" fill="#101820">1894</text>
    <text x="96" y="1012" font-size="18" fill="#6B4423" font-style="italic">Still searching every weekend. The ticket he asks for is,</text>
    <text x="96" y="1038" font-size="18" fill="#6B4423" font-style="italic">in his own words, &#8220;one way&#8221;.</text>
  </g>

  <!-- Gil return -->
  <g>
    <text x="976" y="890" font-size="22" font-weight="bold" fill="#16314F">RETURN</text>
    <circle cx="992" cy="916" r="9" fill="#16314F"/>
    <line x1="992" y1="916" x2="1400" y2="916" stroke="#16314F" stroke-width="5"/>
    <polygon points="1400,902 1436,916 1400,930" fill="#16314F"/>
    <line x1="1436" y1="948" x2="1028" y2="948" stroke="#16314F" stroke-width="5"/>
    <polygon points="1028,934 992,948 1028,962" fill="#16314F"/>
    <text x="976" y="990" font-size="17" fill="#101820">2010</text>
    <text x="1390" y="990" font-size="17" fill="#101820">1920s</text>
    <text x="976" y="1012" font-size="18" fill="#16314F" font-style="italic">He comes back, leaves Inez, and stays in a Paris that is</text>
    <text x="976" y="1038" font-size="18" fill="#16314F" font-style="italic">merely present &#8212; and raining.</text>
  </g>
</svg>
