<style>
  html,body{margin:0;padding:0;background:#FBF7EF;}
  text{font-family:'Liberation Serif',Georgia,serif;} svg{display:block;}
</style>
<svg width="1600" height="960" viewBox="0 0 1600 960" xmlns="http://www.w3.org/2000/svg">
  <rect width="1600" height="960" fill="#FBF7EF"/>
  <text x="80" y="72" font-size="40" font-weight="bold" fill="#16314F">The Staircase With No Bottom</text>
  <text x="80" y="110" font-size="22" fill="#6B4423" font-style="italic">Why <tspan font-style="italic">Midnight in Paris</tspan> ends where <tspan font-style="italic">The Third Level</tspan> does not: every golden age has its own golden age</text>
  <line x1="80" y1="132" x2="1520" y2="132" stroke="#16314F" stroke-width="2.5"/>

  <!-- steps -->
  <g>
    <!-- step 1 -->
    <rect x="90" y="186" width="620" height="112" fill="#16314F"/>
    <text x="120" y="228" font-size="26" font-weight="bold" fill="#FBF7EF">PARIS, 2010</text>
    <text x="120" y="262" font-size="19" fill="#CDDDEA">Gil, a screenwriter, finds the present shallow.</text>
    <text x="120" y="288" font-size="19" fill="#8FBEDD" font-style="italic">&#8220;The Twenties &#8212; that was the golden age.&#8221;</text>

    <!-- step 2 -->
    <rect x="230" y="318" width="620" height="112" fill="#234E77"/>
    <text x="260" y="360" font-size="26" font-weight="bold" fill="#FBF7EF">PARIS, THE 1920s</text>
    <text x="260" y="394" font-size="19" fill="#CDDDEA">Adriana, Picasso&#8217;s muse, finds the Jazz Age dull.</text>
    <text x="260" y="420" font-size="19" fill="#A8CDE6" font-style="italic">&#8220;The Belle &#201;poque &#8212; that was the golden age.&#8221;</text>

    <!-- step 3 -->
    <rect x="370" y="450" width="620" height="112" fill="#4B3B68"/>
    <text x="400" y="492" font-size="26" font-weight="bold" fill="#FBF7EF">PARIS, THE 1890s</text>
    <text x="400" y="526" font-size="19" fill="#DCD3EA">Degas and Gauguin find their own Paris empty.</text>
    <text x="400" y="552" font-size="19" fill="#BFB2D8" font-style="italic">&#8220;The Renaissance &#8212; that was the golden age.&#8221;</text>

    <!-- step 4 -->
    <rect x="510" y="582" width="620" height="112" fill="#7E6BA0" opacity="0.85"/>
    <text x="540" y="624" font-size="26" font-weight="bold" fill="#FBF7EF">FLORENCE, THE 1500s</text>
    <text x="540" y="658" font-size="19" fill="#EDE7F4">&#8212; and so, presumably, on.</text>
    <text x="540" y="684" font-size="19" fill="#EDE7F4" font-style="italic">The staircase never reaches a floor.</text>

    <!-- fading -->
    <rect x="650" y="714" width="620" height="52" fill="#A79BC4" opacity="0.5"/>
    <text x="680" y="748" font-size="24" fill="#4B3B68" letter-spacing="8">. . . . . .</text>
  </g>

  <!-- regress label under the fading step -->
  <text x="960" y="792" font-size="18" fill="#6B4423" letter-spacing="3" text-anchor="middle">INFINITE REGRESS</text>

  <!-- Charley marker -->
  <g>
    <rect x="1150" y="186" width="330" height="150" fill="none" stroke="#6B4423" stroke-width="2" stroke-dasharray="7 6"/>
    <text x="1172" y="222" font-size="21" font-weight="bold" fill="#6B4423">Where is Charley?</text>
    <text x="1172" y="254" font-size="17" fill="#101820">He takes one step down &#8212; to</text>
    <text x="1172" y="278" font-size="17" fill="#101820">1894 &#8212; and Finney never asks</text>
    <text x="1172" y="302" font-size="17" fill="#101820">him to take the next. The story</text>
    <text x="1172" y="326" font-size="17" fill="#101820">stops before the trap appears.</text>
  </g>

  <!-- footer quote -->
  <line x1="80" y1="818" x2="1520" y2="818" stroke="#16314F" stroke-width="1.5"/>
  <text x="80" y="862" font-size="24" fill="#16314F" font-style="italic">&#8220;Golden Age thinking &#8212; the erroneous notion that a different time period is better than</text>
  <text x="80" y="896" font-size="24" fill="#16314F" font-style="italic">the one one&#8217;s living in. It&#8217;s a flaw in the romantic imagination of those people who</text>
  <text x="80" y="930" font-size="24" fill="#16314F" font-style="italic">find it difficult to cope with the present.&#8221;</text>
  <text x="1180" y="930" font-size="20" fill="#6B4423">&#8212; Paul, <tspan font-style="italic">Midnight in Paris</tspan></text>
</svg>
