<style>
  html,body{margin:0;padding:0;background:#08111C;}
  text{font-family:'Liberation Serif',Georgia,serif;} svg{display:block;}
</style>
<svg width="1200" height="1800" viewBox="0 0 1200 1800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#08111C"/>
      <stop offset="45%" stop-color="#102338"/>
      <stop offset="100%" stop-color="#08111C"/>
    </linearGradient>
    <radialGradient id="amber" cx="50%" cy="72%" r="62%">
      <stop offset="0%" stop-color="#E8B978" stop-opacity="1"/>
      <stop offset="38%" stop-color="#C08A48" stop-opacity="0.85"/>
      <stop offset="78%" stop-color="#6B4423" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#6B4423" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="spill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D9A566" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#D9A566" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="vign" cx="50%" cy="42%" r="72%">
      <stop offset="60%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.75"/>
    </radialGradient>
    <clipPath id="archclip">
      <path d="M340 800 L340 470 A 260 260 0 0 1 860 470 L860 800 Z"/>
    </clipPath>
  </defs>

  <rect width="1200" height="1800" fill="url(#sky)"/>

  <!-- faint constellation dots (Grand Central's painted ceiling) -->
  <g fill="#8FBEDD" opacity="0.30">
    <circle cx="150" cy="150" r="2.5"/><circle cx="260" cy="96" r="2"/><circle cx="360" cy="200" r="2.5"/>
    <circle cx="980" cy="130" r="2.5"/><circle cx="1080" cy="215" r="2"/><circle cx="880" cy="260" r="2"/>
    <circle cx="120" cy="330" r="2"/><circle cx="1050" cy="380" r="2.5"/><circle cx="205" cy="452" r="2"/>
    <circle cx="1010" cy="520" r="2"/><circle cx="96" cy="600" r="2.5"/><circle cx="1112" cy="640" r="2"/>
    <circle cx="185" cy="700" r="2"/><circle cx="1030" cy="742" r="2.5"/>
  </g>

  <!-- light spilling out of the portal, across the floor -->
  <polygon points="340,800 860,800 1080,1105 120,1105" fill="url(#spill)"/>

  <!-- the arch interior -->
  <g clip-path="url(#archclip)">
    <rect x="330" y="200" width="540" height="620" fill="#0C1A2A"/>
    <ellipse cx="600" cy="770" rx="330" ry="270" fill="url(#amber)"/>
    <!-- descending steps, narrowing into the glow -->
    <g fill="#0C1A2A" opacity="0.55">
      <rect x="352" y="782" width="496" height="16"/>
      <rect x="380" y="752" width="440" height="15"/>
      <rect x="406" y="724" width="388" height="14"/>
      <rect x="432" y="698" width="336" height="13"/>
      <rect x="458" y="674" width="284" height="12"/>
      <rect x="482" y="652" width="236" height="11"/>
      <rect x="504" y="632" width="192" height="10"/>
      <rect x="524" y="614" width="152" height="9"/>
    </g>
    <!-- gas lamps flanking the stair -->
    <g fill="#F0CFA0">
      <circle cx="392" cy="640" r="9"/><circle cx="392" cy="640" r="20" opacity="0.22"/>
      <circle cx="808" cy="640" r="9"/><circle cx="808" cy="640" r="20" opacity="0.22"/>
    </g>
    <rect x="388" y="646" width="7" height="120" fill="#050C14"/>
    <rect x="805" y="646" width="7" height="120" fill="#050C14"/>
  </g>

  <!-- arch frame + mullions -->
  <path d="M340 800 L340 470 A 260 260 0 0 1 860 470 L860 800" fill="none" stroke="#5A3A1E" stroke-width="9"/>
  <g stroke="#5A3A1E" stroke-width="5" opacity="0.9">
    <path d="M470 800 L470 300"/><path d="M600 560 L600 212"/><path d="M730 800 L730 300"/>
    <path d="M352 560 L848 560"/>
  </g>
  <!-- keystone clock -->
  <g transform="translate(600,196)">
    <circle r="46" fill="#0C1A2A" stroke="#5A3A1E" stroke-width="6"/>
    <circle r="34" fill="none" stroke="#C08A48" stroke-width="2" opacity="0.7"/>
    <line x1="0" y1="0" x2="0" y2="-24" stroke="#E8B978" stroke-width="4" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="17" y2="9" stroke="#E8B978" stroke-width="4" stroke-linecap="round"/>
    <circle r="3.5" fill="#E8B978"/>
  </g>

  <!-- the commuter, backlit at the threshold -->
  <g transform="translate(600,800)" fill="#050C14">
    <ellipse cx="2" cy="3" rx="48" ry="7" opacity="0.5"/>
    <rect x="-21" y="-54" width="16" height="54"/>
    <rect x="6" y="-54" width="16" height="54"/>
    <path d="M-31 -122 q31 -17 62 0 l6 72 h-74 z"/>
    <rect x="30" y="-118" width="11" height="64"/>
    <rect x="25" y="-56" width="36" height="27" rx="3"/>
    <rect x="39" y="-61" width="9" height="6"/>
    <rect x="-7" y="-140" width="14" height="16"/>
    <circle cx="0" cy="-150" r="20"/>
    <ellipse cx="0" cy="-168" rx="33" ry="6"/>
    <path d="M-19 -168 q0 -27 19 -27 q19 0 19 27 z"/>
  </g>

  <rect width="1200" height="1800" fill="url(#vign)"/>

  <!-- ================= TYPE ================= -->
  <text x="600" y="1215" font-size="27" fill="#8FBEDD" letter-spacing="11" text-anchor="middle">TWO LEVELS TAKE YOU HOME</text>

  <text x="600" y="1350" font-size="103" font-weight="bold" fill="#F6EEE1" letter-spacing="3" text-anchor="middle">THE THIRD LEVEL</text>

  <line x1="215" y1="1392" x2="985" y2="1392" stroke="#C08A48" stroke-width="2"/>
  <text x="600" y="1452" font-size="37" fill="#E8B978" font-style="italic" text-anchor="middle">The third takes you back.</text>

  <text x="600" y="1538" font-size="22" fill="#AFC4D6" text-anchor="middle">The railroads will swear there are only two.</text>
  <text x="600" y="1572" font-size="22" fill="#AFC4D6" text-anchor="middle">One evening in a wrong corridor, an ordinary commuter</text>
  <text x="600" y="1606" font-size="22" fill="#AFC4D6" text-anchor="middle">walks out of 1950 and into the summer of 1894.</text>

  <line x1="380" y1="1652" x2="820" y2="1652" stroke="#3C556C" stroke-width="1.5"/>

  <text x="600" y="1698" font-size="18" fill="#8DA6BA" letter-spacing="4" text-anchor="middle">BASED ON THE SHORT STORY BY JACK FINNEY</text>
  <text x="600" y="1728" font-size="16" fill="#6C8398" letter-spacing="3" text-anchor="middle">AN IMAGINED ADAPTATION &#183; CLASS XII ENGLISH PROJECT</text>

  <text x="600" y="1782" font-size="25" fill="#C08A48" letter-spacing="9" text-anchor="middle">COMING 2026</text>
</svg>
